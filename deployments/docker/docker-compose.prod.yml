# Production compose for Coolify/Docker VPS deployment.
# Secrets harus di-inject via environment (bukan di-commit).
#
# HTTP API sengaja di-bind ke loopback (127.0.0.1) — akses publik harus lewat
# reverse proxy (Traefik/Coolify) yang menyediakan auth. Protocol TCP ports
# tetap publik karena device GPS konek dari jaringan seluler.
services:
  dukungps:
    image: ${DUKUNGPS_IMAGE:-ghcr.io/akordium-id/dukungps:latest}
    ports:
      - "${GT06_PORT:-5023}:5023"
      - "${TELTONIKA_PORT:-5027}:5027"
      - "${HUABAO_PORT:-5020}:5020"
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - HTTP_ADDR=:8080
      - AUTO_REGISTER_DEVICES=${AUTO_REGISTER_DEVICES:-false}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  dukungps-web:
    image: ${DUKUNGPS_WEB_IMAGE:-ghcr.io/akordium-id/dukungps-web:latest}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=http://dukungps:8080
    depends_on:
      - dukungps
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dukungps}
      - POSTGRES_USER=${POSTGRES_USER:-dukungps}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
