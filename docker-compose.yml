services:
  dukungps:
    build: .
    ports:
      - "${GT06_PORT:-5023}:5023"
      - "${TELTONIKA_PORT:-5027}:5027"
      - "${HUABAO_PORT:-5020}:5020"
      - "${HTTP_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgres://dukungps:dukungps@postgres:5432/dukungps
      - REDIS_URL=redis:6379
      - HTTP_ADDR=:8080
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  dukungps-web:
    build: ../dukungps-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=http://dukungps:8080
    depends_on:
      - dukungps
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=dukungps
      - POSTGRES_USER=dukungps
      - POSTGRES_PASSWORD=dukungps
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
